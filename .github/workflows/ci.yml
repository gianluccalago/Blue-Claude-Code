name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  app:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx eslint src
      - run: npx vitest run
      - run: npx vite build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-publica-de-exemplo
  banco:
    name: Migrations do zero + RLS por perfil
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Instala cliente psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Aplica migrations e roda o smoke de RLS
        run: bash scripts/db-check.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
